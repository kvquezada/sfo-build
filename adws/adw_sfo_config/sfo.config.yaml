# ─────────────────────────────────────────────────────────────────────────────
#  sfo-build — one roster, one prompt set, many targets.
#
#  `tools:` is CAPABILITY. `writes:` is BOUNDARY. (Hard rule 9.)
#  They are not the same statement and neither implies the other: `shell` runs
#  anything and `write` reaches any path, so a capability list is a statement of
#  intent that nothing checks. `writes:` is what permissions.ts enforces.
#
#  Tool names here are the NEUTRAL vocabulary (see adw_modules/tool_map.ts):
#  read write edit search glob shell fetch subagent skill sql
#  An unmapped name is a hard failure at validate time, never a silent drop.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  coding_agent: copilot
  model: gemini-3.6-flash
  thinking: medium
  data_dir: ~/.sfo-build
  # Empty on purpose. The factory now lives OUTSIDE every target repo, so there
  # is no in-repo path to protect; permissions.ts watches the factory tree as a
  # tripwire instead, where ANY change is a breach.
  protected_files: []

observability:
  db: ~/.sfo-build/sfo.db
  poll_ms: 500

# ─────────────────────────────────────────────────────────────────────────────
#  Context ceilings — DECLARED BY YOU, not measured.
#
#  Copilot's `--context` is a tier (`default` | `long_context`), not a number,
#  and no catalog exposes a window size, so the stream can never tell us one:
#  `context_window` on every agent_sessions row is 0 and always will be. The
#  trace UI draws its CONTEXT bar against the numbers below and says, in the
#  tooltip, that they came from this file.
#
#  VERIFY THESE before trusting the percentage. They are starting values, not
#  probed facts — nothing in this factory can check them the way the target
#  registrar checks a test command. A model with no row here shows its token
#  count and no percentage, which is the honest default.
# ─────────────────────────────────────────────────────────────────────────────
models:
  claude-sonnet-5:   { context_window: 264000 }
  claude-opus-5:     { context_window: 200000 }
  claude-haiku-4.5:  { context_window: 200000 }
  gpt-5.6-terra:     { context_window: 400000 }
  gpt-5.6-luna:      { context_window: 328000 }  # declared, not measured — same tier as terra
  gemini-3.6-flash:  { context_window: 264000 }
  grok-4.6:          { context_window: 328000 }   # declared by the operator, not probed

agents:
  - name: planner
    model: claude-sonnet-5
    thinking: high
    color: "#a78bfa"
    purpose: Turn a request into a plan the builder can implement without asking questions.
    tools: [read, search, glob, shell, write, subagent]
    # The planner plans; it must not implement. `specs/` is repo-level on
    # purpose — the record of what was asked for belongs in one place, not
    # scattered into whichever package a scoped run happened to touch.
    writes: ["specs/"]

  - name: builder
    model: gpt-5.6-terra
    thinking: medium
    color: "#22d3ee"
    purpose: Implement the plan exactly and report every file changed.
    tools: [read, search, glob, shell, write, edit]

  - name: scout
    model: gemini-3.6-flash
    thinking: low
    color: "#fbbf24"
    purpose: Find and report where things live. Changes nothing.
    tools: [read, search, glob, write]
    # Read-only with respect to the REPO. Scout still writes its findings into
    # the session handoff directory, which is outside every repo and therefore
    # outside this boundary entirely.
    writes: []

  - name: reviewer
    # A DIFFERENT VENDOR from the builder, on purpose. A reviewer that shares
    # the builder's failure modes approves the builder's mistakes.
    model: claude-sonnet-5
    thinking: high
    color: "#fb7185"
    purpose: Confirm the build is what was asked for. Judges; never fixes.
    tools: [read, search, glob, shell, write]
    writes: []

  - name: adversary
    # A THIRD vendor, and that is the whole point: the builder is OpenAI, the
    # reviewer is Anthropic, and a judge sharing either one's failure modes is
    # a second opinion in name only — they run concurrently precisely to be
    # independent. This replaces gpt-5.6-luna, which shared the builder's
    # family as the lesser evil back when nothing else was available.
    # Probed on this account: `grok-4.6` is accepted and takes `high`.
    # Spellings that are NOT available: grok-4, grok-4-6, grok-4.6-fast.
    model: grok-4.6
    thinking: high
    color: "#f59e0b"
    purpose: Hunt for what the reviewer would wave through. Judges; never fixes.
    # Read-only like the reviewer, and for the same reason. `shell` is here to
    # read git, not to write — `writes: []` is what actually holds the line.
    tools: [read, search, glob, shell, write]
    writes: []

  - name: correlator
    # A DIFFERENT VENDOR from scout, for the reviewer's reason: an agent that
    # shares the scout's failure modes believes the scout's mistakes.
    model: claude-sonnet-5
    thinking: high
    color: "#34d399"
    purpose: Read the per-repo scout reports and name the seam between them.
    # No repo is ever opened. It reads the scout reports in the session handoff
    # directory, which is outside every checkout — that is what lets one agent
    # reason across repos none of them were allowed to see at once.
    tools: [read, search, glob, write]
    writes: []

  - name: cartographer
    # The correlator's sibling. Same inputs, same read-only boundary, opposite
    # question: the correlator must name a seam, this one describes the path
    # and is allowed to conclude that the two sides agree.
    model: claude-sonnet-5
    thinking: high
    color: "#38bdf8"
    purpose: Describe how a request flows across the repos and what the sides agree on. Describes; never judges.
    tools: [read, search, glob, write]
    writes: []

  - name: advisor
    model: claude-sonnet-5
    thinking: high
    color: "#60a5fa"
    purpose: Propose at most three candidate fixes for a traced issue, best first, with trade-offs. Proposes; never implements.
    tools: [read, search, glob, write]
    writes: []

  - name: documenter
    model: claude-haiku-4.5
    # `none` is not a preference — claude-haiku-4.5 rejects every other level
    # with "does not support reasoning effort configuration". Measured, not
    # assumed; `npm run doctor` probes this pair and will say so if it changes.
    thinking: none
    color: "#e879f9"
    purpose: Write up a completed change from its diff.
    # `shell` is not decoration: without it the documenter cannot mkdir the
    # directory its own task tells it to write into, and `create` does not make
    # parent directories. It failed a real run that way, then quietly wrote its
    # report into COPILOT_HOME instead. `writes:` still bounds it to markdown.
    tools: [read, search, glob, write, edit, shell]
    writes: ["app_docs/", "docs/", "**/*.md", "*.md"]

# ─────────────────────────────────────────────────────────────────────────────
#  Targets are NOT here. They are per machine, in ~/.sfo-build/targets.yaml
#  (`<data_dir>/targets.yaml`, or $SFO_TARGETS): a path on your laptop means
#  nothing on a teammate's, and a registry every clone appends to conflicts on
#  every pull. A `targets:` key in this file is refused at load time.
#
#  Register with `npm run install-target -- --path <repo> --name <n> --write`,
#  or write a row by hand. The fields are in the sfo-build skill's
#  cookbooks/update_targets.md.
# ─────────────────────────────────────────────────────────────────────────────
